[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
recode-core = { path = "crates/core" }
recode-tools = { path = "crates/tools" }
recode-extensions = { path = "crates/extensions" }
recode-providers = { path = "crates/providers" }
recode-runtime = { path = "crates/runtime" }
recode-store = { path = "crates/store" }
recode-tui = { path = "crates/tui" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
futures-util = "0.3"
http = "1"
insta = "1.49"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
# No TLS until cloud providers arrive: local runtimes speak plain HTTP on loopback,
# and leaving it out keeps the build free of C crypto toolchains for now.
# rustls (not the system OpenSSL) keeps the build free of a C TLS toolchain dependency for packaging.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
# No TLS here either until cloud providers choose a crypto provider, so https MCP servers are reported as unsupported.
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", features = ["inline"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }
wiremock = "0.6"

oo7 = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Syntax highlighting is unusably slow unoptimised, so dependencies are optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "debuginfo"
