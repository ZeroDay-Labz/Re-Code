<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- re-code: a terminal prompt inside a rounded dark tile, in the orange → pink → violet gradient the app uses. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8c3a"/>
      <stop offset="0.5" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2838"/>
      <stop offset="1" stop-color="#15141c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#edge)"/>
  <rect x="28" y="28" width="456" height="456" rx="94" fill="#16151e"/>
  <!-- the diamond the home screen uses as its mark -->
  <g filter="url(#glow)">
    <path d="M256 96 L352 192 L256 288 L160 192 Z" fill="url(#g)"/>
  </g>
  <!-- a prompt chevron and cursor: it's a terminal -->
  <path d="M150 332 L226 388 L150 444" fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="258" y="396" width="118" height="40" rx="12" fill="url(#g)"/>
</svg>
